<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro | NEXUS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #08152f, #29205c, #543c9e);
            font-family: Arial, sans-serif;
            color: white;
        }

        .registro {
            background: #141b35;
            padding: 35px;
            border-radius: 18px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 10px 35px #0007;
        }

        h1 {
            text-align: center;
            color: #b5a0ff;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border-radius: 8px;
            border: none;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #7864e8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #9785ff;
        }

        a {
            color: #b5a0ff;
        }

        .errores {
            color: #ff9baf;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="registro">
        <h1>NEXUS ✦</h1>
        <h2>Crear cuenta</h2>

        <form method="POST">
            {% csrf_token %}

            {{ formulario.non_field_errors }}

            {% for campo in formulario %}
                <label for="{{ campo.id_for_label }}">
                    {{ campo.label }}
                </label>

                {{ campo }}

                <div class="errores">
                    {{ campo.errors }}
                </div>
            {% endfor %}

            <button type="submit">
                Registrarme
            </button>
        </form>

        <p style="text-align:center;">
            <a href="{% url 'inicio' %}">
                Volver a NEXUS
            </a>
        </p>
    </div>
</body>
</html>
